<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/src/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
        <style>
            body {
                font-family: "Outfit", sans-serif;
                font-optical-sizing: auto;
                font-weight: 400;
                font-style: normal;
            }
        </style>
        <title>Website project template</title>
    </head>
    <script>
        const loadComponents = (id, url) => {
            fetch(url)
                .then((response) => response.text())
                .then((html) => {
                    document.getElementById(id).innerHTML = html;
                });
        };

        window.onload = () => {
            loadComponents("hero", "src/sections/hero.html");
        };
    </script>
    <body class="overflow-x-hidden">
        <div id="hero"></div>

        <!-- Test section to demonstrate sticky behavior -->
        <div style="height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; position: relative; z-index: 50; top: -50px;">
            <p>Scroll up to see the blue hexagon stick! </p>
        </div>

        <!-- Additional content -->
        <div style="height: 100vh; background: #f3f4f6; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #374151;">
            <p>Keep scrolling to test the sticky effect...</p>
        </div>
    </body>
</html>
