<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Outfit:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <script src="https://kit.fontawesome.com/53a1123324.js" crossorigin="anonymous"></script>
  <title>Baumeister</title>
</head>
<script>
  const loadComponents = (id, url) => {
    if (document.readyState === "complete") {
      fetch(url)
        .then((response) => response.text())
        .then((html) => {
          let content = document.getElementById(id);

          content.innerHTML = html;
          const myNavBar = content.querySelector(".navBar");
          const dialog = content.querySelector(".navigations");
          const upperBar = myNavBar.querySelector(".upperBar");
          const middleBar = myNavBar.querySelector(".middleBar");
          const lowerBar = myNavBar.querySelector(".lowerBar");
          const languageSelector = content.querySelector(".languageSelector");

          myNavBar.addEventListener("click", function () {
            const heroSection = document.getElementById("heroSection");
            const heroText = document.getElementById("heroText");
            const descriptionSection = document.getElementById("description");
            const descriptionVectorSection =
              document.getElementById("description-vector");

            if (dialog.open) {
              dialog.close();

              languageSelector.classList.add(
                "fixed",
                "left-8",
                "top-12",
                "md:top-4"
              );
              languageSelector.classList.remove("absolute");

              if (heroText) {
                heroText.style.display = "block";
              }

              if (descriptionSection) {
                descriptionSection.style.display = "block";
              }
              if (descriptionVectorSection) {
                descriptionVectorSection.style.display = "block";
              }

              if (window.innerWidth < 640 && heroSection) {
                heroSection.style.marginTop = "35vh";
              }
            } else {
              dialog.show();

              languageSelector.classList.remove(
                "fixed",
                "left-8",
                "top-12",
                "md:top-4"
              );
              languageSelector.classList.add("absolute");

              if (heroText) {
                heroText.style.display = "none";
              }

              if (descriptionSection) {
                descriptionSection.style.display = "none";
              }
              if (descriptionVectorSection) {
                descriptionVectorSection.style.display = "none";
              }

              if (window.innerWidth < 640 && heroSection) {
                heroSection.style.marginTop = "65vh";
              }
            }

            upperBar.classList.toggle("transform");
            upperBar.classList.toggle("rotate-45");
            upperBar.classList.toggle("top-0.5");
            lowerBar.classList.toggle("transform");
            lowerBar.classList.toggle("-rotate-45");
            lowerBar.classList.toggle("-top-1");
            middleBar.classList.toggle("hidden");
          });
        });
    }
  };

 window.onload = function () {
    loadComponents("header", "/sections/navBar.html");
    loadComponents("hero", "/sections/hero.html");
    loadComponents("description", "/sections/description.html");
    loadComponents("description-vector", "/sections/description-vector.html");
    loadComponents("strategy", "/sections/strategy.html");
};
</script>

<body class="bg-[#EFECEA] overflow-x-hidden" style="font-family: Outfit">
  <div id="header"></div>
  <!--   Hero section -->
  <div id="hero"></div>
  <!--Description section-->
  <div id="description"></div>
  <!--Vectors below Description section-->
  <div id="description-vector" class="sticky top-0"></div>
  <div id="strategy" class="sticky top-0"></div>
</body>
<script src="/src/main.js"></script>

</html>
