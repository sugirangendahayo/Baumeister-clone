<!-- HERO SECTION: Edge-to-Edge Background with Sticky & Grid for Hexagons (Desktop), Absolute for Mobile -->

<!-- Desktop Version -->
<div class="hidden lg:block w-full bg-gray-50 h-[1028px] ">
  <!-- This container is ONLY for content, NOT for background hexagons -->
  <div class="relative max-w-[1512px] mx-auto h-[1028px]">

    <!-- Grid container that allows overflow for hexagons -->
    <div style="
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(12, 85.67px);
      width: 100vw;            /* Stretches grid to fill viewport */
      max-width: 100vw;        /* Ensures no horizontal scrollbars */
      height: 1028px;
      position: absolute;      /* Let hexagons use full width */
      left: 50%;
      transform: translateX(-50%);
      overflow: visible;       /* Let child images overflow */
      top: 0;
      z-index: 10;
     
    ">
      <!-- Hexagon Images -->
      <!-- Yellow hexagon - left, touches edge -->
      <img src="assets/images/yellowVector.png"
        alt=""
        style="grid-column: 1 / 7; grid-row: 3 / 9; z-index: 20; width: 100%; margin-left: -10%; margin-top:5%; object-fit: contain;position: sticky; top: 0;"
      />

      <!-- Red hexagon - bottom left, can overflow right if needed -->
      <img src="assets/images/redVector.png"
        alt=""
        style="grid-column: 2 / 8; grid-row: 8 / 13; z-index: 20; width: 115%; margin-top: -5%; object-fit: contain; position: sticky; top: 0;"
      />

      <!-- Green hexagon (left) -->
      <img src="assets/images/greenVector.png"
        alt=""
        style="grid-column: 3 / 7; grid-row: 5 / 10; z-index: 30; width: 110%; margin-left: 10%; object-fit: contain; position: sticky; top: 0;"
      />

      <!-- Pink hexagon -->
      <img src="assets/images/pinkVector.png"
        alt=""
        style="grid-column: 5 / 7; grid-row: 3 / 5; z-index: 10; width: 90%; margin-left: 15%; margin-top: 20%; object-fit: contain; position: sticky; top: 0;"
      />

      <!-- Blue hexagon -->
      <img id="blueVector"
        src="assets/images/blueVector.png"
        alt=""
        style="grid-column: 5 / 11; grid-row: 4 / 10; z-index: 40; width: 105%; margin-left: 10%; object-fit: contain; position: sticky; top: 0;"
      />

      <!-- Dark green hexagon - right, add margin-right to OVERRIDE grid constraint -->
      <img src="assets/images/greenVector_2.png"
        alt=""
        style="grid-column: 10 / 13; grid-row: 6 / 11; z-index: 30; width: 120%; margin-right: 0%; object-fit: contain; justify-self: end;"
      />
    </div>

    <!-- Content block sits above grid, stays within max width -->
    <div
      class="absolute top-[56.23%] left-[33.66%] w-[32.34%] z-50 font-outfit text-white leading-tight"
      style="font-size: clamp(32px, 3.17vw, 48px);"
    >
      <p>We help you set</p>
      <p>focus and gain</p>
      <p>impact. By adding</p>
      <p>to the conversation,</p>
      <p>not to the noise.</p>
    </div>
  </div>
</div>
